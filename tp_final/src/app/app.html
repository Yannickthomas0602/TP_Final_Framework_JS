<header>
	<nav aria-label="Navigation principale">
		<a routerLink="/" aria-label="Accueil Campus Material">Campus Material</a>
		<div>
			@if (session.utilisateur(); as utilisateur) {
				<button type="button" (click)="basculerMenu()">
					<span aria-hidden="true">&#128100;</span> {{ utilisateur.nom }}
				</button>
				@if (menuOuvert()) {
					<button type="button" (click)="seDeconnecter()">Se déconnecter</button>
				}
			} @else {
				<button type="button" routerLink="/login">Se connecter</button>
			}
			<button type="button" routerLink="/catalogue">Catalogue</button>
			@if (session.utilisateur()?.role === 'student') {
				<button type="button" routerLink="/mes-reservations">Réservations</button>
			}
			@if (session.utilisateur()?.role === 'manager') {
				<button type="button" routerLink="/gestion">Gérer les catalogues et les réservations</button>
			}
		</div>
	</nav>
</header>

<router-outlet />
