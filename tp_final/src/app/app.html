<header>
	<nav aria-label="Navigation principale">
		<a routerLink="/" aria-label="Accueil Campus Material">Campus Material</a>
		<div>
			@if (session.utilisateur(); as utilisateur) {
				<div class="profile-menu">
					<button class="profile-trigger" type="button" aria-haspopup="true" [attr.aria-expanded]="menuOuvert()" (click)="basculerMenu()">
						<span aria-hidden="true">&#128100;</span> {{ utilisateur.nom }}
					</button>
					@if (menuOuvert()) {
						<button class="logout-menu" type="button" (click)="seDeconnecter()">
							Se déconnecter
						</button>
					}
				</div>
			} @else {
				<button class="nav-action" type="button" routerLink="/login" routerLinkActive="nav-action--active">Se connecter</button>
			}
			<button class="nav-action" type="button" routerLink="/catalogue" routerLinkActive="nav-action--active">Catalogue</button>
			@if (session.utilisateur()?.role === 'student') {
				<button class="nav-action" type="button" routerLink="/mes-reservations" routerLinkActive="nav-action--active">Réservations</button>
			}
			@if (session.utilisateur()?.role === 'manager') {
				<button class="nav-action" type="button" routerLink="/gestion" routerLinkActive="nav-action--active">Gérer les catalogues et les réservations</button>
			}
		</div>
	</nav>
</header>

<main>
	<router-outlet />
</main>
