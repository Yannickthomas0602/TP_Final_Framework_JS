<h1>{{ modification ? 'Modifier une fiche matériel' : 'Ajouter une fiche matériel' }}</h1>

<form #formulaire="ngForm" (ngSubmit)="enregistrer(formulaire)" novalidate>
  <label>
    <span>Nom <span aria-hidden="true">*</span></span>
    <input type="text" name="nom" [(ngModel)]="nom" required>
  </label>

  <label>
    <span>Catégorie <span aria-hidden="true">*</span></span>
    <select name="categorie" [(ngModel)]="categorie" required>
      <option value="">Sélectionner une catégorie</option>
      @for (categorieOption of categories; track categorieOption) {
        <option [value]="categorieOption">{{ categorieOption }}</option>
      }
    </select>
  </label>

  <label>
    <span>Description</span>
    <textarea name="description" [(ngModel)]="description"></textarea>
  </label>

  <label>
    <span>Localisation <span aria-hidden="true">*</span></span>
    <input type="text" name="localisation" [(ngModel)]="localisation" required>
  </label>

  @if (erreur()) {
    <p role="alert">{{ erreur() }}</p>
  }

  <button type="submit">Enregistrer</button>
  <a routerLink="/gestion">Annuler</a>
</form>
