<section class="status-page status-page--denied" aria-labelledby="access-denied-title">
  <p class="status-code" aria-hidden="true">403</p>
  <p class="status-label">Accès refusé</p>
  <h1 id="access-denied-title">Cette page n’est pas dans votre cahier.</h1>
  <p class="status-message">
    Votre compte est bien connecté, mais vos droits ne permettent pas d’ouvrir cet espace.
    Revenez au catalogue ou utilisez un compte autorisé.
  </p>
  <div class="status-actions">
    <a class="status-action" routerLink="/catalogue">Retour au catalogue</a>
    <a class="status-action status-action--light" routerLink="/login">Changer de compte</a>
  </div>
</section>
